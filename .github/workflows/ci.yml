name: desktop app checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: ./scripts/package-macos.sh
      - name: Verify app bundle
        run: |
          codesign --verify --deep --strict dist/Continuity.app
          for binary in MacOS/Continuity Helpers/continuity-agent; do
            lipo dist/Continuity.app/Contents/$binary -verify_arch arm64 x86_64
          done
          plutil -lint dist/Continuity.app/Contents/Info.plist
          dist/Continuity.app/Contents/Helpers/continuity-agent scan --format json --local --history-dir "$RUNNER_TEMP/history" > "$RUNNER_TEMP/scan.json"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))['report']['resources']" "$RUNNER_TEMP/scan.json"
          hdiutil verify dist/Continuity.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: continuity-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
