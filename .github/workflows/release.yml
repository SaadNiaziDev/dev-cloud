name: draft macOS release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Check tag and source
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          ./scripts/test-icons.sh
      - name: Build and verify preview
        run: |
          ./scripts/package-macos.sh
          codesign --verify --deep --strict dist/Continuity.app
          test -s dist/Continuity.app/Contents/Resources/ToolIcons/nodejs.svg
          test -s dist/Continuity.app/Contents/Resources/ToolIcons/LICENSE
          for binary in MacOS/Continuity Helpers/continuity-agent; do
            lipo "dist/Continuity.app/Contents/$binary" -verify_arch arm64 x86_64
          done
          hdiutil verify dist/Continuity.dmg
          cd dist
          shasum -a 256 Continuity.dmg > SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = "true"
            gh release upload "$GITHUB_REF_NAME" dist/Continuity.dmg dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Continuity.dmg dist/SHA256SUMS \
              --draft --prerelease --title "Continuity $GITHUB_REF_NAME" \
              --notes "Preview build for macOS 14 or later. This build is ad-hoc signed and is not notarized. Review the artifacts before publishing."
          fi
