[package]
name = "continuity-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
jsonschema = { version = "0.60.2", default-features = false }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
